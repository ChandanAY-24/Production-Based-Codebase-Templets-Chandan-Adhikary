name: security-checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Commit Guardian & AST Security Gate
        run: |
          python hooks/commit-guardian.py

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          python -m pip_audit -r requirements.txt

      - name: Python SAST Scanner (bandit)
        run: |
          python -m bandit -r src backend plugins connectors -s B101,B112,B404,B603

      - name: Run Super-TDD & Security Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
