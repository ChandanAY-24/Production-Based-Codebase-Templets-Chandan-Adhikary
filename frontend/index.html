<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDD Agentic Coding Cockpit</title>
  <style>
    :root {
      --bg-primary: #09090b;
      --bg-surface: #18181b;
      --border-subtle: #27272a;
      --text-primary: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-primary: #3b82f6;
      --accent-danger: #ef4444;
      --accent-success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem;
      line-height: 1.5;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 2rem;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 600;
    }
    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      background: #1e3a8a;
      color: #93c5fd;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1.5rem;
      transition: transform 120ms ease;
    }
    .card:hover {
      transform: translateY(-2px);
    }
    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    .card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .status-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: #064e3b;
      color: #6ee7b7;
      font-family: monospace;
    }
    button {
      background-color: var(--accent-primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 100ms ease, opacity 150ms ease;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1 class="title">Spec-Driven Development Cockpit</h1>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Autonomous Multi-Agent Orchestration & Verification</p>
    </div>
    <span class="badge">SPEC-KIT &bull; V1.0</span>
  </div>

  <div class="grid" id="task-container">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
        <h3>Scaffold SDD Agentic Architecture</h3>
        <span class="status-tag">VERIFIED</span>
      </div>
      <p>Spec: <code>docs/SPEC.md#L45</code></p>
      <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">
        Invariants: Zero unbounded mutation, Deterministic rollback, Surgical diff bounds
      </div>
      <button onclick="alert('Verification consensus signed off.')">View Verification</button>
    </div>
  </div>
</body>
</html>
